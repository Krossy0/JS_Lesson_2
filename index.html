
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <header>

            <h1>Memory Game</h1>


        </header>


        <div class="game-info">

            <div class="info-box">
                <span class="info-title">MOVES</span>
                <span class="info-number" id="moves">0</span>
            </div>

            <div class="info-box">
                <span class="info-title">MATCHED PAIRS</span>
                <span class="info-number">
                    <span id="pairs">0</span>/10
                </span>
            </div>

            <button id="restart" onclick="startGame()">
                ↻ Restart
            </button>

        </div>


        <div id="game-cards" class="game-cards"></div>


    </div>


    <script src="script.js"></script>

</body>

</html>
